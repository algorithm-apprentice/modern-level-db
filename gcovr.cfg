# Coverage report shared by CI and local runs; see docs/adr/0019-test-coverage-policy.md.
root = .
search-path = build/coverage
filter = src/
filter = include/
exclude-pattern-prefix = GCOVR
exclude-throw-branches = yes
exclude-unreachable-branches = yes
# A failing assert aborts before gcov writes its counters, so that branch can never be recorded.
exclude-branches-by-pattern = \s*assert\(
warn-excluded-lines-with-hits = yes
