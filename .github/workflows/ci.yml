name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  changes:
    name: ${{ github.event_name == 'push' && 'push / changes' || 'changes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check change-routing contracts
        run: python3 tests/tools/ci_changes_test.py
      - name: Classify changed paths
        id: classify
        run: python3 tools/ci_changes.py

  unit:
    name: ${{ github.event_name == 'push' && 'push / unit' || 'unit' }} (${{ matrix.os }}, ${{ matrix.build_type }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        build_type:
          - Debug
          - Release

    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' && 'ubuntu-24.04' || matrix.os }}
    env:
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}

    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; engine build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'

      - name: Configure
        if: env.RUN_FULL_CI == 'true'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMODERN_LEVELDB_BUILD_TESTS=ON
          -DMODERN_LEVELDB_WARNINGS_AS_ERRORS=ON

      - name: Build
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build build

      - name: Run tests
        if: env.RUN_FULL_CI == 'true'
        run: ctest --test-dir build --output-on-failure --no-tests=error

  crc32c-portable:
    name: ${{ github.event_name == 'push' && 'push / crc32c-portable' || 'crc32c-portable' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
      CXX: g++-13
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; portable checksum build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Configure portable CRC32C
        if: env.RUN_FULL_CI == 'true'
        run: >
          cmake -S . -B build/crc32c-portable -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMODERN_LEVELDB_BUILD_TESTS=ON
          -DHAVE_ARM64_CRC32C:BOOL=OFF
          -DHAVE_SSE42:BOOL=OFF
      - name: Build checksum tests
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build build/crc32c-portable --target modern_leveldb_unit_tests --parallel 2
      - name: Check portable checksum contracts
        if: env.RUN_FULL_CI == 'true'
        run: ctest --test-dir build/crc32c-portable -R '^Crc32cTest\.' --output-on-failure --no-tests=error

  coverage:
    name: ${{ github.event_name == 'push' && 'push / coverage' || 'coverage' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}

    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; coverage build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.RUN_FULL_CI == 'true'
        with:
          python-version: "3.12"

      - name: Install coverage tools
        if: env.RUN_FULL_CI == 'true'
        run: python -m pip install gcovr==8.6 diff-cover==10.6.0

      - name: Configure
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset coverage

      - name: Build
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset coverage

      - name: Run tests
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset coverage

      - name: Report coverage
        if: env.RUN_FULL_CI == 'true'
        shell: bash
        run: |
          mkdir -p build/coverage/html
          gcovr --gcov-executable gcov-13 --txt --txt-summary \
            --cobertura build/coverage/coverage.xml \
            --html-details build/coverage/html/index.html 2>&1 \
            | tee build/coverage/gcovr.log
          if grep -q '(ERROR)' build/coverage/gcovr.log; then
            echo "::error::gcovr reported errors; check exclusion markers"
            exit 1
          fi

      - name: Check changed-code coverage
        if: env.RUN_FULL_CI == 'true'
        run: >
          diff-cover build/coverage/coverage.xml
          --compare-branch=origin/main
          --branch-coverage
          --fail-under=100

      - name: Upload coverage report
        if: always() && env.RUN_FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.xml
            build/coverage/html/

  compatibility:
    name: ${{ github.event_name == 'push' && 'push / compatibility' || 'compatibility' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
      CXX: g++-13
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; compatibility build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Configure extended harness
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset compatibility -DCMAKE_BUILD_TYPE=Release
      - name: Build extended harness
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset compatibility --target modern_leveldb_extended_tests --parallel 2
      - name: Run model, differential, and crash tests
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset compatibility
      - uses: actions/upload-artifact@v4
        if: failure() && env.RUN_FULL_CI == 'true'
        with:
          name: compatibility-failure
          path: build/compatibility/Testing/Temporary/

  fuzz:
    name: ${{ github.event_name == 'push' && 'push / fuzz' || 'fuzz' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; fuzz toolchain, build, and campaigns are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Install LLVM fuzzing toolchain
        if: env.RUN_FULL_CI == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev
      - name: Configure fuzz targets
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build fuzz targets
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset fuzz --parallel 2
      - name: Run bounded fuzz campaigns
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset fuzz
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_FULL_CI == 'true'
        with:
          name: fuzz-results
          path: |
            build/fuzz/fuzz/*-smoke/corpus/
            build/fuzz/fuzz/*-smoke/artifacts/
            build/fuzz/Testing/Temporary/

  asan:
    name: ${{ github.event_name == 'push' && 'push / asan' || 'asan' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; sanitizer toolchain, build, and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Install sanitizer toolchain
        if: env.RUN_FULL_CI == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev
      - name: Configure ASan and UBSan
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset asan -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build sanitizer suite
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset asan --parallel 2
      - name: Run sanitizer suite
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset asan
      - uses: actions/upload-artifact@v4
        if: failure() && env.RUN_FULL_CI == 'true'
        with:
          name: asan-failure
          path: build/asan/Testing/Temporary/

  tsan:
    name: ${{ github.event_name == 'push' && 'push / tsan' || 'tsan' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' && 'ubuntu-24.04' || 'macos-latest' }}
    timeout-minutes: 20
    env:
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; thread-sanitizer build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Configure ThreadSanitizer
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset tsan
      - name: Build ThreadSanitizer suite
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset tsan --parallel 2
      - name: Run concurrent component and model tests
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset tsan
      - uses: actions/upload-artifact@v4
        if: failure() && env.RUN_FULL_CI == 'true'
        with:
          name: tsan-failure
          path: build/tsan/Testing/Temporary/

  benchmark:
    name: ${{ github.event_name == 'push' && 'push / benchmark' || 'benchmark' }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
      CXX: g++-13
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; comparative benchmark build and execution are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Configure Release benchmark
        if: env.RUN_FULL_CI == 'true'
        run: cmake --preset benchmarks
      - name: Build benchmark
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset benchmarks --parallel 2
      - name: Check comparative performance baseline
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset benchmarks
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_FULL_CI == 'true'
        with:
          name: benchmark-results
          path: |
            build/benchmarks/benchmarks/results.json
            build/benchmarks/Testing/Temporary/

  performance:
    name: ${{ github.event_name == 'push' && 'push / performance' || 'performance' }} (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 20
    env:
      RUN_FULL_CI: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Acknowledge documentation-only change
        if: env.RUN_FULL_CI == 'false'
        run: echo "Documentation-only change; profiling build and tests are not required."
      - uses: actions/checkout@v4
        if: env.RUN_FULL_CI == 'true'
      - name: Configure optimized profiling harness
        if: env.RUN_FULL_CI == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cmake --preset profiling -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          else
            cmake --preset profiling
          fi
      - name: Build profiling harness
        if: env.RUN_FULL_CI == 'true'
        run: cmake --build --preset profiling --parallel 2
      - name: Run workload and report contracts
        if: env.RUN_FULL_CI == 'true'
        run: ctest --preset profiling
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_FULL_CI == 'true'
        with:
          name: performance-${{ matrix.os }}
          path: |
            build/profiling/benchmarks/performance-smoke/
            build/profiling/benchmarks/performance-mutations/
            build/profiling/Testing/Temporary/
