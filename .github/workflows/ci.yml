name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        build_type:
          - Debug
          - Release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMODERN_LEVELDB_BUILD_TESTS=ON
          -DMODERN_LEVELDB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-13

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tools
        run: python -m pip install gcovr==8.6 diff-cover==10.6.0

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Run tests
        run: ctest --preset coverage

      - name: Report coverage
        shell: bash
        run: |
          mkdir -p build/coverage/html
          gcovr --gcov-executable gcov-13 --txt --txt-summary \
            --cobertura build/coverage/coverage.xml \
            --html-details build/coverage/html/index.html 2>&1 \
            | tee build/coverage/gcovr.log
          if grep -q '(ERROR)' build/coverage/gcovr.log; then
            echo "::error::gcovr reported errors; check exclusion markers"
            exit 1
          fi

      - name: Check changed-code coverage
        run: >
          diff-cover build/coverage/coverage.xml
          --compare-branch=origin/main
          --branch-coverage
          --fail-under=100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.xml
            build/coverage/html/

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Configure extended harness
        run: cmake --preset compatibility -DCMAKE_BUILD_TYPE=Release
      - name: Build extended harness
        run: cmake --build --preset compatibility --target modern_leveldb_extended_tests --parallel 2
      - name: Run model, differential, and crash tests
        run: ctest --preset compatibility
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compatibility-failure
          path: build/compatibility/Testing/Temporary/

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM fuzzing toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev
      - name: Configure fuzz targets
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build fuzz targets
        run: cmake --build --preset fuzz --parallel 2
      - name: Run bounded fuzz campaigns
        run: ctest --preset fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results
          path: |
            build/fuzz/fuzz/
            build/fuzz/Testing/Temporary/
